name = "refresh-scheduler"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Starts workflows whose GitHub `schedule:` is unreliable (GitHub drops
# scheduled runs when busy). Cloudflare's free plan allows 5 cron triggers per
# account (stathead-sports uses one; the 2026-10-22 deploy failed at 6), so
# this worker has ONE trigger: every minute any schedule uses. The schedules
# themselves, and which workflow each starts, are SCHEDULES in src/index.ts;
# each firing starts those whose cron matches its minute. UTC, no DST, like
# GitHub. Keep this string equal to TRIGGER in src/index.ts
# (scripts/test-refresh-scheduler.ts checks both).
#   7,27,47 11-23,0-4  refresh-injuries.yml: every 20 min, 7am-11pm ET
#   23 1,7,13,19       sleeper-trade-crawl.yml: every 6 h
#   17 10              trade-db-analysis.yml: daily trade values
#   41 13              yahoo-trade-crawl.yml: daily
#   0 13               daily-report.yml: daily email
[triggers]
crons = ["0,7,17,23,27,41,47 * * * *"]

# Secret (pushed by deploy-workers.yml from the REFRESH_DISPATCH_TOKEN repo
# secret, or by hand: npx wrangler secret put GH_TOKEN):
#   GH_TOKEN  fine-grained GitHub token, repository dachhack/stathead only,
#             permission "Actions: Read and write".
[vars]
REPO = "dachhack/stathead"
REF = "claude/nfl-fantasy-workbench-6D1yd"
