[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stathead"
version = "0.2.1"
description = "Python client for the StatHead fantasy football model — rookie career predictions, historical ADP, and flattened feature matrices."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "StatHead" }]
keywords = ["fantasy-football", "nfl", "rookie-prospects", "adp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pandas>=1.5",
]

[project.optional-dependencies]
polars = ["polars>=0.20"]
duckdb = ["duckdb>=0.10"]
dev = ["pytest>=7", "polars>=0.20", "duckdb>=0.10"]

[project.urls]
Homepage = "https://github.com/dachhack/stathead"
Source = "https://github.com/dachhack/stathead"
Issues = "https://github.com/dachhack/stathead/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/stathead"]

[tool.pytest.ini_options]
testpaths = ["tests"]
