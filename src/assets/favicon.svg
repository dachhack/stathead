<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark rounded background matching the masthead (bg-secondary) -->
  <rect width="64" height="64" rx="13" fill="#1a2733"/>
  <!-- StatHead mark (football + bar chart), centered -->
  <g transform="translate(0.08,-1.6) scale(0.84)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Football outline (rounded tips, ~1.8:1) -->
    <path d="M8 40 C20 18 56 18 68 40 C56 62 20 62 8 40 Z" stroke="#4ade80" stroke-width="3.5" fill="none"/>
    <!-- Side panel seams (tucked inside the tips) -->
    <path d="M22 31 Q17 40 22 49" stroke="#4ade80" stroke-width="2.5" fill="none"/>
    <path d="M54 31 Q59 40 54 49" stroke="#4ade80" stroke-width="2.5" fill="none"/>
    <!-- Laces -->
    <line x1="29" y1="30" x2="47" y2="30" stroke="#4ade80" stroke-width="2.5"/>
    <line x1="30" y1="27" x2="30" y2="33" stroke="#4ade80" stroke-width="1.8"/>
    <line x1="34" y1="27" x2="34" y2="33" stroke="#4ade80" stroke-width="1.8"/>
    <line x1="38" y1="27" x2="38" y2="33" stroke="#4ade80" stroke-width="1.8"/>
    <line x1="42" y1="27" x2="42" y2="33" stroke="#4ade80" stroke-width="1.8"/>
    <line x1="46" y1="27" x2="46" y2="33" stroke="#4ade80" stroke-width="1.8"/>
    <!-- Bar chart (ascending, slate → white) -->
    <rect x="25" y="46" width="5" height="7" rx="1" fill="#7c8aa0"/>
    <rect x="32" y="42" width="5" height="11" rx="1" fill="#9fb0c4"/>
    <rect x="39" y="38" width="5" height="15" rx="1" fill="#cbd5e1"/>
    <rect x="46" y="34" width="5" height="19" rx="1" fill="#ffffff"/>
  </g>
</svg>
