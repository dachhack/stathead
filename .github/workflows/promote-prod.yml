name: Promote to Production

# One-click QA → production promotion. Advances the `production` branch to
# a QA commit and deploys it to stathead.app (Cloudflare Pages) in the same
# run. Fast-forwards when it can; otherwise merges the QA commit into
# production with a "Promote:" merge commit. Earlier promotions were made as
# merge commits, so production is no longer an ancestor of the QA branch and
# a plain fast-forward push is rejected (every run from 2026-10-06 failed
# "non-fast-forward"). Production carries no content of its own, so the merge
# is always clean and its tree equals the QA commit's.
#
# Run it from the Actions tab ("Run workflow") or trigger it via the API.
# Defaults to promoting the QA/dev branch tip; override `source_ref` to
# promote a specific branch, tag, or SHA.
#
# Note: the push to `production` here uses GITHUB_TOKEN, which by design
# does NOT re-trigger deploy-prod.yml — so this workflow does the deploy
# itself and there's no double deploy. A manual `git push origin
# production` still deploys via deploy-prod.yml.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: QA branch, tag, or SHA to promote to stathead.app
        default: claude/nfl-fantasy-workbench-6D1yd
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: claude/nfl-fantasy-workbench-6D1yd

permissions:
  contents: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://stathead.app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Advance the production branch to ${{ inputs.source_ref }}
        run: |
          SRC=$(git rev-parse HEAD)
          echo "Promoting ${SRC:0:8} (${{ inputs.source_ref }}) to production"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin production
          git checkout -B production origin/production
          if git merge-base --is-ancestor production "$SRC"; then
            echo "Fast-forwarding production"
            git reset -q --hard "$SRC"
          else
            echo "Production has diverged (earlier promotions were merge commits); merging"
            git merge --no-ff -m "Promote: ${{ inputs.source_ref }} @ ${SRC:0:8}" "$SRC"
          fi
          # The promoted tree must be exactly the QA commit's: production carries
          # nothing of its own, so any difference means a bad merge.
          if [ -n "$(git diff --stat "$SRC" HEAD)" ]; then
            echo "::error::promoted tree differs from ${SRC:0:8}; refusing to deploy"
            git diff --stat "$SRC" HEAD
            exit 1
          fi
          git push origin production
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash scripts/download-data.sh
      - run: bash scripts/download-api-data.sh
      - name: Build for the root domain
        run: npm run build
        env:
          BASE_PATH: /
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=stathead --branch=production
