name: Publish stathead-mcp to npm

# Publishes the MCP server package (mcp/) to npm. Two ways to trigger:
#
#   A. Push a tag matching mcp-v* (e.g. mcp-v1.0.0). The tag version is
#      strictly verified against mcp/package.json.
#
#   B. Run manually from the Actions UI (workflow_dispatch). The version
#      from mcp/package.json is used as-is — no tag needed. Friendly for
#      mobile / quick releases. Choose the branch to publish from.
#
# Each run rebuilds the bundle (npm run build:mcp) and smoke-tests it (boots
# the server, asserts it lists tools) BEFORE publishing.
#
# Auth: npm Trusted Publishing (OIDC) — NO long-lived token stored in GitHub.
# GitHub Actions proves its identity to npm per-run via a short-lived OIDC
# credential scoped to this repo + workflow. (Same model as the PyPI publish.)
#
# One-time setup on npmjs.com (the package must already exist):
#   npmjs.com → stathead-mcp → Settings → Trusted Publishing →
#   Add GitHub Actions publisher:
#     Organization or user: dachhack
#     Repository:           stathead
#     Workflow filename:    publish-mcp.yml
#     Environment:          npm   (or leave blank)
#   Then you can delete the old NPM_TOKEN secret and revoke that npm token.
#
# Subsequent releases:
#   1. Bump `version` in mcp/package.json (and SERVER_VERSION in the bundle)
#   2. Either: tag mcp-v1.1.0 + push, OR run workflow_dispatch from the UI,
#      OR (C) push the release commit to the `publish-mcp-now` branch:
#        git push -f origin <commit>:publish-mcp-now
#      C needs only branch-push rights, so a Claude Code session (whose git
#      proxy refuses tag pushes and whose GitHub app cannot dispatch) can
#      release. Guarded: the commit must already be on the default branch.
#      The registry publish (publish-mcp-registry.yml) is chained after a
#      successful npm publish on every trigger.

on:
  push:
    tags:
      - 'mcp-v*'
    branches: [publish-mcp-now]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'dachhack/stathead'
    environment: npm
    permissions:
      contents: read
      id-token: write  # OIDC auth for Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # merge-base for the publish-mcp-now guard below

      # Branch-push trigger safety: only code already merged to the default
      # branch may publish this way, so a stray push to publish-mcp-now from
      # an unmerged branch cannot ship.
      - name: Require the commit to be on the default branch (publish-mcp-now only)
        if: github.ref == 'refs/heads/publish-mcp-now'
        run: |
          git fetch --no-tags origin claude/nfl-fantasy-workbench-6D1yd
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::$(git rev-parse --short HEAD) is not on claude/nfl-fantasy-workbench-6D1yd — merge first, then push that commit to publish-mcp-now."
            exit 1
          fi
          echo "OK: $(git rev-parse --short HEAD) is on claude/nfl-fantasy-workbench-6D1yd."

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Ensure npm supports Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      # Fail fast, before install + bundle + smoke test, on the two ways a
      # release goes wrong in this repo.
      #
      # 1. Version already on npm. The publish then dies on an opaque
      #    `E403 ... cannot publish over the previously published versions`
      #    AFTER a full build — and in practice that means "dispatched from a
      #    branch that doesn't carry the version bump", not a bad package.
      # 2. package.json and the bundle disagree. mcp/dist/server.mjs is
      #    hand-maintained (see src/mcp-server.ts), so its SERVER_VERSION is
      #    bumped by hand and can drift from package.json — which would ship a
      #    server that reports a version npm never served.
      - name: Verify the version is releasable
        run: |
          PKG_VER=$(node -p "require('./mcp/package.json').version")
          BUNDLE_VER=$(node -e 'const m=require("fs").readFileSync("mcp/dist/server.mjs","utf8").match(/SERVER_VERSION = "([^"]+)"/); console.log(m?m[1]:"")')
          echo "mcp/package.json: $PKG_VER | bundle SERVER_VERSION: $BUNDLE_VER | ref: ${GITHUB_REF_NAME}"
          if [ "$PKG_VER" != "$BUNDLE_VER" ]; then
            echo "::error::Version mismatch — mcp/package.json is $PKG_VER but mcp/dist/server.mjs reports $BUNDLE_VER. Bump both."
            exit 1
          fi
          # Empty output also covers a registry hiccup; that just falls through
          # to npm's own check rather than blocking a legitimate release.
          PUBLISHED=$(npm view "stathead-mcp@$PKG_VER" version 2>/dev/null || true)
          if [ -n "$PUBLISHED" ]; then
            echo "::error::stathead-mcp@$PKG_VER is already published. Bump the version in mcp/package.json, or dispatch from a branch that has the bump (this run is on '${GITHUB_REF_NAME}')."
            exit 1
          fi
          echo "OK: $PKG_VER is not yet on npm."

      - name: Install deps
        run: npm ci

      - name: Build the MCP bundle
        run: npm run build:mcp

      - name: Verify tag matches package version (tag-triggered only)
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: |
          TAG="${GITHUB_REF_NAME#mcp-v}"
          PKG_VER=$(node -p "require('./mcp/package.json').version")
          if [ "$TAG" != "$PKG_VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME => $TAG does not match mcp/package.json version $PKG_VER"
            exit 1
          fi

      - name: Smoke test — server boots and lists tools
        run: |
          OUT=$(printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | node mcp/dist/server.mjs)
          COUNT=$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let n=0;for(const l of s.split("\n")){if(!l.trim())continue;try{const j=JSON.parse(l);if(j.id===2)n=j.result.tools.length;}catch{}}console.log(n);})' <<< "$OUT")
          echo "Tools advertised: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::MCP server advertised no tools — refusing to publish"
            exit 1
          fi

      - name: Publish to npm (Trusted Publishing / OIDC)
        working-directory: mcp
        # No NODE_AUTH_TOKEN: npm authenticates via the id-token below.
        # Provenance is attached automatically under Trusted Publishing.
        run: npm publish --access public

      - name: Summary
        run: |
          PKG_VER=$(node -p "require('./mcp/package.json').version")
          echo "Published **stathead-mcp@$PKG_VER** from \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "npx -y stathead-mcp" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # List the new version in the official MCP Registry once npm has it. The
  # called workflow waits for npm to serve the version before publishing.
  registry:
    needs: publish
    uses: ./.github/workflows/publish-mcp-registry.yml
    permissions:
      contents: read
      id-token: write
