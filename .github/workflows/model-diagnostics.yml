name: Model Diagnostics

on:
  workflow_dispatch: # Manual trigger only

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nfl-fantasy-workbench-6D1yd
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache static data
        uses: actions/cache@v4
        with:
          path: public/data
          key: static-data-v3
          restore-keys: static-data-

      - run: npm ci
      - run: bash scripts/download-data.sh
      - run: bash scripts/download-api-data.sh

      - name: Backtest team projections
        run: npm run test:projections
        continue-on-error: true

      - name: Evaluate feature subsets per position
        run: npm run eval:features
        continue-on-error: true

      - name: Test Reddit sentiment features
        run: npm run test:reddit
        continue-on-error: true
