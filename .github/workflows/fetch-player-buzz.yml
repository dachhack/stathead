name: Fetch Player Buzz

# Aggregates recent player news + community chatter (ESPN news + Rotowire
# blurbs, and Reddit r/fantasyfootball, r/dynastyff, r/32beatwriters) into
# public/data/player-buzz.json for the Buzz Tracker tab. Lexicon-scored
# sentiment + per-source volume.
#
# Runs a few times a day so OTA / training-camp blurbs stay fresh. Trigger
# manually from the GitHub app: repo -> Actions -> "Fetch Player Buzz" ->
# "Run workflow" -> pick the branch.

on:
  schedule:
    # Every 8 hours.
    - cron: '15 */8 * * *'
  workflow_dispatch:
    inputs:
      window:
        description: 'Look-back window in days'
        required: false
        default: '14'
      limit:
        description: 'Cap players scanned (0 = all skill players)'
        required: false
        default: '0'
      dry_run:
        description: 'Fetch only, do not commit (for testing)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: fetch-buzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Fetch buzz snapshot
        run: npx tsx scripts/fetch-player-buzz.ts --window=${{ inputs.window || '14' }} --limit=${{ inputs.limit || '0' }}

      - name: LLM sentiment pass (top players)
        # No-op when the secret is unset, so the workflow still ships a
        # lexicon-scored snapshot without an API key configured.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/score-buzz-llm.ts --top=60

      - name: Show snapshot summary
        run: |
          node -e "const b=require('./public/data/player-buzz.json'); console.log('players:', b.players.length); console.log('generated:', b.generated); console.log('scoring:', b.method||'lexicon', b.llmModel?('('+b.llmModel+', '+b.llmScoredPlayers+' players)'):''); console.log('top:', b.players.slice(0,5).map(p=>p.name+' ('+p.volume+')').join(', '));"

      - name: Commit snapshot to triggering branch
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/player-buzz.json
          if git diff --cached --quiet; then
            echo "No changes to commit — buzz snapshot unchanged."
            exit 0
          fi
          TARGET_BRANCH="${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.ref_name }}"
          git commit -m "Fetch player buzz snapshot ($(date -u +%Y-%m-%dT%H:%MZ))

          ESPN + Rotowire + Reddit (r/fantasyfootball, r/dynastyff,
          r/32beatwriters) news volume + lexicon sentiment. Generated by
          .github/workflows/fetch-player-buzz.yml on branch ${TARGET_BRANCH}.

          [skip ci]"
          git push origin HEAD:${TARGET_BRANCH}
