name: Extract PDF Prospect Features

# Pulls password-protected prospect guides from the private companion repo
# (dachhack/stathead-pdfs), extracts per-player features with Claude, and
# commits the resulting JSON back to this repo's main branch.
#
# Setup (one-time) -- see docs/pdf-feature-pipeline.md for full instructions:
#   1. Create private repo dachhack/stathead-pdfs with a pdfs/ folder
#   2. Add repo secrets to THIS repo (Settings -> Secrets -> Actions):
#        ANTHROPIC_API_KEY     API key for Claude
#        PDFS_REPO_PAT         fine-grained PAT: contents:read on stathead-pdfs
#        PDF_PASSWORDS_FILE    full text of pdfs/.passwords.txt (multi-line secret)
#   3. (Optional) Add a notify workflow to the private repo that fires
#      repository_dispatch with type 'pdfs-updated' on push to pdfs/**
#
# Run cost: one Claude call per PDF chunk (~$0.05-$0.30 per guide).
# The pdfs/.cache/ directory is cached across runs keyed on PDF filenames,
# so unchanged guides skip the LLM pass entirely.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [pdfs-updated]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Checkout private PDFs repo
        uses: actions/checkout@v4
        with:
          repository: dachhack/stathead-pdfs
          token: ${{ secrets.PDFS_REPO_PAT }}
          path: .stathead-pdfs

      - name: Stage PDFs into ./pdfs
        run: |
          mkdir -p pdfs
          if [ -d .stathead-pdfs/pdfs ]; then
            cp -r .stathead-pdfs/pdfs/. pdfs/
          else
            echo "::error::.stathead-pdfs/pdfs directory not found in private repo"
            exit 1
          fi
          printf '%s' "${{ secrets.PDF_PASSWORDS_FILE }}" > pdfs/.passwords.txt
          echo "Staged $(ls pdfs/*.pdf 2>/dev/null | wc -l) PDF(s)"

      - name: Restore PDF extraction cache
        uses: actions/cache@v4
        with:
          path: pdfs/.cache
          # Invalidate when a PDF is added/renamed/changed. Unchanged PDFs
          # keep their cached text and Claude-extracted features, so only
          # new or modified guides burn API calls.
          key: pdf-cache-${{ hashFiles('pdfs/*.pdf') }}
          restore-keys: |
            pdf-cache-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r scripts/requirements-pdf.txt

      - name: Extract features
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/extract_pdf_features.py

      - name: Commit feature JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/pdf-prospect-features.json \
                  public/data/pdf-prospect-features-merged.json
          if git diff --cached --quiet; then
            echo "No feature changes to commit"
          else
            git commit -m "Refresh PDF prospect features $(date +%Y-%m-%d)"
            git push
          fi
