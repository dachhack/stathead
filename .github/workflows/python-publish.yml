name: Publish stathead to PyPI

# Publishes the Python package. Two ways to trigger:
#
#   A. Push a tag matching py-v* (e.g. py-v0.1.0). The tag version is
#      strictly verified against python/pyproject.toml.
#
#   B. Run manually from the Actions UI (workflow_dispatch). The version
#      from pyproject.toml is used as-is — no tag needed. Friendly for
#      mobile / quick releases. Choose the branch to publish from.
#
# Uses PyPI trusted publishing (OIDC) — no API token stored in GitHub.
# One-time setup on pypi.org (do this BEFORE the first release):
#   1. Register the project name `stathead` (claim via a first upload;
#      PyPI auto-creates it on publish).
#   2. pypi.org → Your account → Publishing → Add a new pending publisher
#      PyPI Project name: stathead
#      Owner:             dachhack
#      Repo:              stathead
#      Workflow:          python-publish.yml
#      Environment:       pypi
#   3. Repo Settings → Environments → New environment `pypi`
#      (optional: require a reviewer to approve)
#
# Subsequent releases:
#   1. Bump `version` in python/pyproject.toml
#   2. Bump `__version__` in python/src/stathead/__init__.py
#   3. Either: tag py-v0.2.0 + push, OR run workflow_dispatch from the UI

on:
  push:
    tags:
      - 'py-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install + test
        working-directory: python
        run: |
          pip install -e ".[dev]"
          pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install build
        run: pip install build
      - name: Build sdist + wheel
        working-directory: python
        run: python -m build
      - name: Verify tag matches pyproject version (tag-triggered only)
        if: startsWith(github.ref, 'refs/tags/py-v')
        working-directory: python
        run: |
          TAG="${GITHUB_REF_NAME#py-v}"
          PKG_VER=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG" != "$PKG_VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME => $TAG does not match pyproject version $PKG_VER"
            exit 1
          fi
      - name: Show pyproject version (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        working-directory: python
        run: |
          PKG_VER=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "Publishing stathead $PKG_VER from ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

