name: Publish stathead to PyPI

# Builds + publishes the Python package on tags matching py-v*.
# Example tag for release 0.2.0:  py-v0.2.0
#
# Uses PyPI trusted publishing (OIDC) — no API token stored in GitHub.
# One-time setup on pypi.org (do this BEFORE the first release):
#   1. Register the project name `stathead` by uploading a first build
#      manually, or reserve it via PyPI if available.
#   2. Project → Publishing → Add trusted publisher
#      Owner:    dachhack
#      Repo:     stathead
#      Workflow: python-publish.yml
#      Environment: pypi
#   3. Repo Settings → Environments → New environment `pypi`
#      (optional: require a reviewer to approve)
#
# Releasing a new version:
#   1. Bump `version` in python/pyproject.toml
#   2. Bump `__version__` in python/src/stathead/__init__.py
#   3. git commit + git tag py-v0.2.0 + git push --tags

on:
  push:
    tags:
      - 'py-v*'
  workflow_dispatch:  # allow manual trigger too

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install + test
        working-directory: python
        run: |
          pip install -e ".[dev]"
          pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build
        run: pip install build
      - name: Build sdist + wheel
        working-directory: python
        run: python -m build
      - name: Verify the tag matches pyproject version
        working-directory: python
        run: |
          TAG="${GITHUB_REF_NAME#py-v}"
          PKG_VER=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG" != "$PKG_VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME => $TAG does not match pyproject version $PKG_VER"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
