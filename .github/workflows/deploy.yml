name: Deploy to GitHub Pages

on:
  push:
    branches: [main, "claude/nfl-fantasy-workbench-6D1yd"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Cache static data files between builds
      - name: Cache static data
        uses: actions/cache@v4
        with:
          path: public/data
          key: static-data-v13

      - run: npm ci
      - run: bash scripts/download-data.sh
      - run: bash scripts/download-api-data.sh
      - run: npm run build

      # Commit training rows cache back to repo so future builds skip data fetching
      - name: Commit training rows cache
        run: |
          if ls public/data/training-rows-cache-*.json 1>/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f public/data/training-rows-cache-*.json
            git diff --cached --quiet || git commit -m "Auto-commit training rows cache [skip ci]" && git push || true
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
