name: Deploy to GitHub Pages

on:
  push:
    branches: [main, "claude/nfl-fantasy-workbench-6D1yd"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Cache static data files between builds (saves ~8 min of downloads)
      - name: Cache static data
        uses: actions/cache@v4
        with:
          path: public/data
          key: static-data-v2
          restore-keys: static-data-

      - run: npm ci
      - run: bash scripts/download-data.sh
      - run: bash scripts/download-api-data.sh
      - name: Backtest team projections (old vs new)
        run: npm run test:projections
        continue-on-error: true
      - name: Evaluate feature subsets per position
        run: npm run eval:features
        continue-on-error: true
      - name: Test Reddit sentiment features
        run: npm run test:reddit
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
