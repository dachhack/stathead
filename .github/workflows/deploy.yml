name: Deploy to GitHub Pages

on:
  push:
    branches: [main, "claude/nfl-fantasy-workbench-6D1yd", "claude/ktc-forecast-integration-MxLri"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Latest deploy wins. With `false`, back-to-back merges overlap and the second
  # run's deploy step 400s on GitHub Pages' "one in-progress deployment" limit.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash scripts/download-data.sh
      - run: bash scripts/download-api-data.sh
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Pages ingestion has stalled well past the action's 10-minute
          # default (2026-08-06: runs aborted after polling
          # "deployment_in_progress" for the full window). 20 minutes rides
          # out a slow ingest instead of failing the deploy.
          timeout: 1200000
