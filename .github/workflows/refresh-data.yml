name: Refresh Data

on:
  schedule:
    # Every 2 hours, 7am-11pm EST (12:00-04:00 UTC)
    - cron: '0 12,14,16,18,20,22,0,2,4 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/nfl-fantasy-workbench-6D1yd
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Bump the key whenever download-data.sh starts fetching files it didn't
      # before. actions/cache only writes a new cache when the PRIMARY key
      # misses ("Cache hit occurred on the primary key ..., not saving cache"),
      # so with a constant key the cache freezes at whatever was first saved and
      # every newly-added file is re-downloaded on every run, forever. The
      # restore-keys prefix still restores the previous cache, so a bump
      # re-downloads only what's actually new.
      # v5: per-season NGS split + 2025 advanced stats / FTN / PBP / participation.
      - name: Cache static data
        uses: actions/cache@v5
        with:
          path: public/data
          key: static-data-v5
          restore-keys: static-data-

      # The cache restores OVER the checked-out tree, so any TRACKED file in
      # public/ that another workflow committed after the cache was saved comes
      # back stale — and the commit step below then pushes that staleness as if
      # it were fresh. That is not hypothetical: the 2026 Consensus preset was
      # rebuilt by refresh-clay.yml at 16:39 UTC on 2026-08-19 (448 players) and
      # silently reverted to a June build (416) by the 20:00 refresh.
      # Committed files are authoritative; the cache exists for the UNTRACKED
      # nflverse downloads, which this leaves alone.
      - name: Restore tracked files over the cache
        run: |
          # Listed BEFORE the checkout — afterwards there is nothing left to
          # name. --name-only covers TRACKED changes only: `git status
          # --porcelain` would also count the untracked nflverse downloads the
          # cache exists to carry, which are not being reverted here.
          git diff --name-only -- public/ > /tmp/cache-clobbered.txt || true
          echo "Reset $(wc -l < /tmp/cache-clobbered.txt) tracked file(s) in public/ to the committed version; untracked downloads kept."
          head -20 /tmp/cache-clobbered.txt
          git checkout -- public/ 2>/dev/null || true

      - run: npm ci
      - run: bash scripts/download-data.sh
      - run: bash scripts/download-api-data.sh

      # Refresh anonymized expert activity. The username list comes from the
      # EXPERT_USERNAMES repo secret (newline-separated) so it's never committed.
      # Skipped when the secret is unset. Runs before the build so the output
      # ships in dist/. If EXPERT_NAMES_PASSPHRASE is also set, the name map is
      # encrypted into expert-names.enc.json (committed + deployed) so the
      # Social Graph can unlock usernames with that passphrase; the plaintext
      # map is still deleted and never ships.
      - name: Build expert data
        env:
          EXPERT_USERNAMES: ${{ secrets.EXPERT_USERNAMES }}
          EXPERT_NAMES_PASSPHRASE: ${{ secrets.EXPERT_NAMES_PASSPHRASE }}
        run: |
          if [ -n "$EXPERT_USERNAMES" ]; then
            mkdir -p private
            printf '%s\n' "$EXPERT_USERNAMES" > private/expert-usernames.txt
            python3 scripts/build_expert_data.py --weeks 1 || echo "expert build failed (non-fatal)"
            if [ -n "$EXPERT_NAMES_PASSPHRASE" ] && [ -s public/data/expert-names.json ]; then
              node scripts/encrypt-expert-names.mjs || echo "name-map encryption failed (non-fatal)"
            fi
            rm -f public/data/expert-names.json  # local-only name map — never deploy/commit
          else
            echo "EXPERT_USERNAMES secret not set — skipping expert data build"
          fi

      # Remove stale precomputed output so a failed precompute is never silently masked
      - run: rm -f public/data/feature-matrix.json
      - run: npm run build

      # Fail the build if precompute didn't produce output
      - name: Verify precomputed features
        run: |
          if [ ! -s public/data/feature-matrix.json ]; then
            echo "ERROR: feature-matrix.json was not generated — precompute likely failed"
            exit 1
          fi
          echo "OK: feature-matrix.json exists ($(du -h public/data/feature-matrix.json | cut -f1))"

      # Rebuild the FIRST-PARTY projection base pool headlessly — the SAME pure
      # builder the Projections tab uses (src/lib/buildProjectionPool.ts) — then
      # run the scenario-engine presets over it so the MCP's preset projections
      # refresh automatically with the data. Both outputs are derived StatHead
      # numbers and committed: projection-base-2026.json powers the MCP's
      # by-team Excel; redraft-projections-presets.json powers preset queries.
      #
      # The Consensus preset blends toward Mike Clay's paid (ESPN+) numbers,
      # which we must NOT commit or ship. We materialize the raw extract from
      # the CLAY_PROJECTIONS_B64 secret (base64 of gzipped
      # clay-projections-<season>.json) ONLY here — after `npm run build`, so it
      # never enters dist/ — use it to rebuild the derived presets, then delete
      # it (it's also gitignored, so it can never be committed). build:pool needs
      # no Clay (Clay never touches the base pool's stat lines). If the secret is
      # unset, the base pool still refreshes and the existing committed presets
      # (with Consensus) are preserved untouched.
      # Runs after `npm run build` so feature-matrix.json + score-store exist.
      - name: Build projection base + presets
        env:
          CLAY_PROJECTIONS_B64: ${{ secrets.CLAY_PROJECTIONS_B64 }}
        run: |
          SEASON=2026
          npm run build:pool
          if [ -n "$CLAY_PROJECTIONS_B64" ]; then
            printf '%s' "$CLAY_PROJECTIONS_B64" | base64 -d | gunzip > "public/data/clay-projections-${SEASON}.json" \
              && echo "Materialized clay-projections-${SEASON}.json ($(du -h public/data/clay-projections-${SEASON}.json | cut -f1)) from secret"
          else
            echo "CLAY_PROJECTIONS_B64 not set — the consensus presets will be kept from their last build."
          fi
          # Always run. precompute-projection-presets.ts MERGES onto the
          # committed file and stamps each preset with its own build time, so a
          # Clay-less run refreshes the four pool-derived presets against the
          # fresh pool and leaves consensus/consensus-ml exactly as they were.
          # Before that merge landed this had to be gated on the secret, which
          # left rookie-/vet-optimistic and injury-skeptic frozen at whatever
          # the last manual Clay dispatch produced — months stale by August.
          npm run build:presets
          rm -f public/data/clay-projections-*.json public/data/clay-team-projections-*.json \
                public/data/clay-unit-grades-*.json public/data/clay-matchups-*.json

      # Distill the big feature-matrix.json (~25 MB) into the compact, MCP-served
      # model-eval artifact: per-position feature importance + each scored
      # player's feature drivers (proprietary features sanitized to band+direction).
      # Runs after `npm run build` produced feature-matrix.json.
      - name: Build model-eval artifact
        run: node scripts/build-model-eval.mjs

      # Project kickers as components (FG attempts/makes by distance band + XPs)
      # from pbp-slim history. Runs BEFORE the weekly build, which reads this
      # artifact for its K rows so the weekly feed, the season board and the
      # components all quote one kicker number. Never fatal.
      - name: Build kicker projections
        run: python3 scripts/build-kicker-projections.py 2026 || echo "kicker projections build failed (non-fatal)"

      # Team-defense components (points allowed + takeaways). Same placement
      # reason as the kickers: the weekly build reads this for its DST rows.
      - name: Build DST projections
        run: python3 scripts/build-dst-projections.py 2026 || echo "DST projections build failed (non-fatal)"

      # Split the freshly-rebuilt season pool into per-week projections
      # (opponent def-vs-pos multipliers + home/away, normalized back to the
      # season line). Reads projection-base + schedule + prior-year weekly
      # stats — all committed, no extra deps. Never fatal.
      - name: Build weekly projections
        run: python3 scripts/build-weekly-projections.py || echo "weekly projections build failed (non-fatal)"

      # Archive what we projected, once a week, so next offseason can score it.
      # Nothing keeps a projection as it stood before the games were played,
      # which is exactly why the skill-position schedule adjustment could not be
      # validated this year: there is no record to backtest against. Tuesday
      # (day 2) is after Monday night, so a snapshot covers a complete week.
      # gzip -n drops the mtime header, so an unchanged pool produces identical
      # bytes and no pointless commit. ~150 KB a week, ~2.5 MB a season.
      - name: Archive the weekly projection snapshot
        run: |
          if [ "$(date -u +%u)" != "2" ]; then
            echo "Not Tuesday — no snapshot this run."
            exit 0
          fi
          mkdir -p public/data/projection-history
          stamp=$(date -u +%Y-%m-%d)
          for base in projection-base-2026 kicker-projections-2026 dst-projections-2026; do
            src="public/data/${base}.json"
            [ -s "$src" ] || { echo "  skipped ${base} (not built this run)"; continue; }
            gzip -9 -n -c "$src" > "public/data/projection-history/${base}-${stamp}.json.gz"
            echo "  archived ${base}-${stamp}.json.gz ($(du -h "public/data/projection-history/${base}-${stamp}.json.gz" | cut -f1))"
          done

      # Refresh the committed 2026 schedule. Opponents are fixed, but flex
      # scheduling moves kickoff dates and networks all season, and the weekly
      # projections + the site's schedule views read this file. The builder
      # keeps its previous `updated` stamp when the games are byte-identical,
      # so this only produces a commit when something actually moved.
      - name: Refresh the season schedule
        run: node scripts/build_schedule.mjs 2026 || echo "schedule refresh failed (non-fatal)"

      # Rebuild the player crosswalk against the freshly-downloaded rosters
      # + feature-matrix. This is what promotes post-draft rookies from
      # their synthetic COL keys to canonical NFL gsis-based keys as soon
      # as nflverse publishes the updated roster. The builder reads the
      # uncompressed roster_*.csv written by download-data.sh in preference
      # to the committed roster_*.csv.gz snapshot, so CI always sees the
      # freshest data. Writes:
      #   - public/data/player-crosswalk.json
      #   - public/data/player-aliases.json (refreshed unresolved list)
      #   - public/data/player-promotions.json (COL→NFL promotions + any
      #                                         fail-closed unresolved cases)
      - name: Rebuild player crosswalk
        run: python3 scripts/build-player-crosswalk.py

      # Rebuild the slim runtime id-map (sleeper<->gsis<->espn + name/pos/team/
      # headshot) from the freshly-rebuilt crosswalk + current rosters, so apps
      # can map ids at runtime without the ~5MB Sleeper directory. Never fatal.
      - name: Rebuild player id-map
        run: node scripts/build-id-map.mjs || echo "id-map build failed (non-fatal)"

      # Re-gzip the freshly-downloaded current-season nflverse files so the
      # committed .csv.gz fallback snapshots stay current. download-data.sh
      # force-refreshes these every run (the live build uses the .csv), but the
      # tracked .gz are the fallback when nflverse 404s and what local dev, the
      # Python loaders and the published MCP server read — none of which ever
      # run download-data.sh. Without this they drift (post-draft signings,
      # UDFAs, depth-chart churn) and, once the season kicks off, the weekly
      # stats / snaps / injury reports would never reach them at all.
      # injuries, snap counts and player stats don't exist upstream until
      # Week 1 is played, so they're skipped silently until they appear.
      # Bump SEASON each year alongside download-data.sh's DYNAMIC_SEASON.
      # Never fails the build.
      - name: Refresh dynamic nflverse snapshots
        run: |
          SEASON=2026
          for base in roster_${SEASON} depth_charts_${SEASON} injuries_${SEASON} \
                      snap_counts_${SEASON} player_stats_${SEASON}; do
            if [ -s "public/data/${base}.csv" ]; then
              gzip -9 -c "public/data/${base}.csv" > "public/data/${base}.csv.gz" \
                && echo "  refreshed ${base}.csv.gz ($(zcat public/data/${base}.csv.gz | wc -l) rows)"
            else
              echo "  skipped ${base}.csv.gz (not published upstream yet)"
            fi
          done || true
          # Distill offensive depth-chart #1s for the Taxi Squad Advisor.
          node scripts/build-depth-starters.mjs ${SEASON} || true

      # Commit the rebuilt caches back so downstream jobs (model training,
      # coverage audit, local analysis) work off the fresh data instead of
      # whatever last got checked in. [skip ci] prevents this commit from
      # triggering another refresh cascade.
      - name: Commit refreshed caches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Staged one path at a time on purpose: `git add a b c` aborts and
          # stages NOTHING if any single pathspec matches no file, so one
          # absent artifact (an in-season file before Week 1, a non-fatal
          # builder that bailed) would silently drop the whole cache commit.
          for p in public/data/training-rows-cache-*.json \
                   public/data/feature-matrix.json \
                   public/data/projection-base-2026.json \
                   public/data/weekly-projections-2026.json \
                   public/data/kicker-projections-2026.json \
                   public/data/dst-projections-2026.json \
                   public/data/schedule-strength-2026.json \
                   public/data/projection-history/ \
                   public/data/schedule-2026.json \
                   public/data/model-eval-2026.json \
                   public/data/redraft-projections-presets.json \
                   public/data/feature-store/ \
                   public/data/score-store/ \
                   public/data/roster_2026.csv.gz \
                   public/data/depth_charts_2026.csv.gz \
                   public/data/injuries_2026.csv.gz \
                   public/data/snap_counts_2026.csv.gz \
                   public/data/player_stats_2026.csv.gz \
                   public/data/depth-starters-2026.json \
                   public/data/player-crosswalk.json \
                   public/data/player-id-map.json \
                   public/data/player-aliases.json \
                   public/data/player-promotions.json \
                   public/data/player-conflicts.json \
                   public/data/espn-nfl-ids.json \
                   public/data/expert-ownership.json \
                   public/data/expert-adds.json \
                   public/data/expert-trades.json \
                   public/data/expert-graph.json \
                   public/data/expert-league-graph.json \
                   public/data/expert-candidates.json \
                   public/data/expert-names.enc.json; do
            [ -e "$p" ] && git add "$p"
          done || true
          if git diff --cached --quiet; then
            echo "No cache changes to commit"
          else
            git commit -m "Auto-commit caches: training rows + models + feature store [skip ci]"
            # Retry push 3 times in case of transient conflicts with concurrent pushes
            pushed=0
            for i in 1 2 3; do
              if git push origin HEAD:claude/nfl-fantasy-workbench-6D1yd; then
                pushed=1
                break
              fi
              echo "Push attempt $i rejected — rebasing onto latest branch..."
              # During a rebase, -X theirs favors the commit being replayed,
              # i.e. this run's fresh caches, over older ones on the branch.
              # || true keeps a rebase failure from aborting the step (set -e):
              # the deploy below must run even if the cache commit is lost.
              git pull --rebase -X theirs origin claude/nfl-fantasy-workbench-6D1yd || true
              sleep $((i * 2))
            done
            # Don't fail the job: that would skip the Pages deploy below, and
            # losing one cache commit is cheaper than losing a deploy.
            if [ "$pushed" != "1" ]; then
              echo "::warning::Failed to push caches after 3 attempts; this run's caches were not committed."
            fi
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Pages ingestion has stalled well past the action's 10-minute
          # default (2026-08-06: runs aborted after polling
          # "deployment_in_progress" for the full window). 20 minutes rides
          # out a slow ingest instead of failing the whole refresh.
          timeout: 1200000
