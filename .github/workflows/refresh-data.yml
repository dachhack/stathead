name: Refresh Data

on:
  schedule:
    # Every 2 hours, 7am-11pm EST (12:00-04:00 UTC)
    - cron: '0 12,14,16,18,20,22,0,2,4 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nfl-fantasy-workbench-6D1yd
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Cache static data files between builds (saves ~8 min of downloads)
      - name: Cache static data
        uses: actions/cache@v4
        with:
          path: public/data
          key: static-data-v2
          restore-keys: static-data-

      - run: npm ci
      - run: bash scripts/download-data.sh
      - run: bash scripts/download-api-data.sh
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
