name: Daily Report

# Emails a daily health + data digest (pipeline activity, surface freshness,
# model snapshot, KTC dynasty movers) and posts it to the Actions job summary.
#
# Runs at 13:00 UTC — after the morning KTC (06:00) + FantasyCalc (06:30)
# snapshots and the noon data refresh, so the freshness numbers reflect the
# day's updates.
#
# Email requires three repository secrets (Settings → Secrets → Actions):
#   MAIL_USERNAME    Gmail address that sends the report
#   MAIL_PASSWORD    Google **App Password** (not the account password —
#                    create at https://myaccount.google.com/apppasswords)
#   REPORT_TO_EMAIL  recipient address
# If the secrets are absent the report still runs and lands in the job summary;
# only the email step is skipped.

# Primary trigger: the refresh-scheduler Cloudflare Worker
# (workers/refresh-scheduler) dispatches this at 13:00 UTC with
# scheduled=true. GitHub's own schedule stays as a fallback; it ran the
# report 3-6 hours late on 2026-10-17..19 and not at all by 16:51 on 10-20.
# Either timed start skips itself if today's report already went out, so
# the two never send two emails. A manual run (scheduled=false) always runs.
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Timed start (skips if today''s report already ran); leave false for an on-demand report'
        required: false
        default: 'false'
  # On-demand trigger that needs only contents-write: push (any commit, e.g. an
  # empty one) to the `report-now` branch and this runs. The job always checks
  # out the default branch below, so the report reflects live data regardless
  # of what's on report-now.
  push:
    branches: [report-now]

permissions:
  contents: read
  # The injury-refresh card reads refresh-injuries.yml's run history.
  actions: read

jobs:
  # One timed report a day: skip when an earlier run today (UTC) of this
  # workflow succeeded or is still going.
  dedupe:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TIMED: ${{ github.event_name == 'schedule' || github.event.inputs.scheduled == 'true' }}
        run: |
          if [ "$TIMED" != "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(date -u +%F)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-report.yml/runs?created=%3E%3D$today&per_page=50" \
            -q "[.workflow_runs[] | select(.id != ${{ github.run_id }} and .id < ${{ github.run_id }})
                 | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")] | length" || echo 0)
          echo "earlier runs today: $n"
          if [ "${n:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Today's report already ran; skipping this timed start."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  report:
    needs: dedupe
    if: needs.dedupe.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/nfl-fantasy-workbench-6D1yd
          # Full history so git-log freshness + commit-activity counts work.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Install the PUBLISHED package so the report's "Package health" section
      # exercises exactly what users get from PyPI (import + default-ref fetch).
      # Non-fatal: if it fails, the report flags the package as unhealthy.
      - name: Install published stathead (health probe)
        run: pip install --quiet --upgrade stathead || echo "stathead install failed — report will flag it"

      - name: Generate report
        id: gen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/daily-report.py report.md report.html
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          # Subject carries the health verdict (✅/⚠️/🚨) so an incomplete
          # surface alerts from the inbox list without opening the email.
          echo "subject=$(head -n1 report-subject.txt 2>/dev/null || echo 'StatHead Daily Report')" >> "$GITHUB_OUTPUT"

      - name: Check mail secrets
        id: cfg
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        run: |
          if [ -n "$MAIL_USERNAME" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Mail secrets not set — skipping email (report is in the job summary)."
          fi

      - name: Email report
        if: steps.cfg.outputs.ready == 'true'
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: StatHead Bot <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.REPORT_TO_EMAIL }}
          subject: "${{ steps.gen.outputs.subject }} — ${{ github.run_id }}"
          # Styled HTML body, with the Markdown as the plain-text fallback for
          # clients that don't render HTML.
          html_body: file://report.html
          body: file://report.md
