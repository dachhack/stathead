name: Build metrics artifacts

# Precompute the MCP metrics artifacts (team-metrics-<season>.json,
# player-metrics-<season>.json, pbp-slim-<season>.json.gz) and commit them.
#
# Why a CI job: these are computed from the ~99MB nflverse play-by-play CSV,
# which can't be fetched + parsed inside the hosted Cloudflare Worker's limits.
# GitHub runners have no such limit, so we compute offline and the Worker serves
# the small committed JSON. The MCP handlers fall back to live compute when an
# artifact is missing (npm/stdio build).
#
# Completed seasons are immutable — generate once. The in-progress season should
# be refreshed (weekly) so its metrics keep up with new games.
#
# Trigger from the GitHub mobile app: repo -> Actions -> "Build metrics
# artifacts" -> "Run workflow" -> set seasons (e.g. "2016 2017 ... 2025").

on:
  schedule:
    # Tuesday 09:00 UTC — after the week's games + nflverse refresh land.
    - cron: '0 9 * * 2'
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Space-separated seasons to (re)build, e.g. "2024 2025". Default: current season.'
        required: false
        default: ''
      dry_run:
        description: 'Build only, do not commit (for testing)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: build-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decide seasons
        id: seasons
        run: |
          if [ -n "${{ inputs.seasons }}" ]; then
            echo "list=${{ inputs.seasons }}" >> "$GITHUB_OUTPUT"
          else
            # Default to the current NFL season (Sept rolls the year forward).
            Y=$(date -u +%Y); M=$(date -u +%m)
            if [ "$M" -ge 9 ]; then echo "list=$Y" >> "$GITHUB_OUTPUT"; else echo "list=$((Y-1))" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Build artifacts
        run: |
          echo "Building seasons: ${{ steps.seasons.outputs.list }}"
          node --max-old-space-size=6144 scripts/build-metrics-artifacts.mjs ${{ steps.seasons.outputs.list }}

      - name: Rebuild coach tendencies
        # Cheap: reads the committed team-metrics artifacts + game coaches +
        # player target shares (no PBP). Refreshes whenever team-metrics change.
        run: node --max-old-space-size=4096 scripts/build-coach-tendencies.mjs

      - name: Show artifacts
        run: ls -la public/data/team-metrics-*.json public/data/player-metrics-*.json public/data/pbp-slim-*.json.gz public/data/coach-tendencies.json 2>/dev/null || true

      - name: Commit artifacts to triggering branch
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/team-metrics-*.json public/data/player-metrics-*.json public/data/pbp-slim-*.json.gz public/data/coach-tendencies.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No metrics-artifact changes to commit."
            exit 0
          fi
          TARGET_BRANCH="${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.ref_name }}"
          git commit -m "Build metrics artifacts (${{ steps.seasons.outputs.list }})

          Precomputed team/player metrics + slim play-by-play for the MCP, built
          by .github/workflows/build-metrics-artifacts.yml.

          [skip ci]"
          for i in 1 2 3; do
            if git push origin HEAD:${TARGET_BRANCH}; then exit 0; fi
            echo "Push attempt $i rejected — rebasing onto latest ${TARGET_BRANCH}..."
            git pull --rebase -X theirs origin ${TARGET_BRANCH}
            sleep $((i * 2))
          done
          echo "Failed to push after 3 attempts."
          exit 1
