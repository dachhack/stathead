<!doctype html>
<!-- This file's existence is load-bearing: without a top-level 404.html,
     Cloudflare Pages treats the site as an SPA and answers EVERY missing
     path with index.html + HTTP 200 — including /data/ files that
     postbuild-pages ships only as .gz. Loaders then "successfully" fetch
     HTML where JSON/CSV should be (this blanked Model Docs and the model
     columns on stathead.app while GitHub Pages QA, which 404s properly,
     was fine). The app routes with #/ hashes, so no SPA fallback is ever
     needed and a real 404 status here is always correct. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not Found — StatHead</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #131c26; color: #e5e7eb;
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #9ca3af; font-size: 14px; margin: 0 0 16px; }
    a { color: #34d399; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>404 — Not Found</h1>
    <p>This page or file doesn't exist.</p>
    <a href="/">Back to StatHead</a>
  </main>
</body>
</html>
