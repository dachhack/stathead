<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark rounded background matching the masthead (--bg-secondary) -->
  <rect width="64" height="64" rx="13" fill="#1a2733"/>
  <!-- StatHead mark (football + bar chart), centered -->
  <g transform="translate(0.84,-0.8) scale(0.82)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Football outline (rounded tips, ~1.85:1) -->
    <path d="M10 40 C22 20 54 20 66 40 C54 60 22 60 10 40 Z" stroke="#4ade80" stroke-width="3.5" fill="none"/>
    <!-- Side panel seams -->
    <path d="M16 30 Q11 40 16 50" stroke="#4ade80" stroke-width="2.5" fill="none"/>
    <path d="M60 30 Q65 40 60 50" stroke="#4ade80" stroke-width="2.5" fill="none"/>
    <!-- Laces -->
    <line x1="29" y1="28" x2="47" y2="28" stroke="#4ade80" stroke-width="2.5"/>
    <line x1="30" y1="25" x2="30" y2="31" stroke="#4ade80" stroke-width="1.8"/>
    <line x1="34" y1="25" x2="34" y2="31" stroke="#4ade80" stroke-width="1.8"/>
    <line x1="38" y1="25" x2="38" y2="31" stroke="#4ade80" stroke-width="1.8"/>
    <line x1="42" y1="25" x2="42" y2="31" stroke="#4ade80" stroke-width="1.8"/>
    <line x1="46" y1="25" x2="46" y2="31" stroke="#4ade80" stroke-width="1.8"/>
    <!-- Bar chart (ascending, slate → white) -->
    <rect x="25" y="46" width="5" height="6" rx="1" fill="#7c8aa0"/>
    <rect x="32" y="42" width="5" height="10" rx="1" fill="#9fb0c4"/>
    <rect x="39" y="38" width="5" height="14" rx="1" fill="#cbd5e1"/>
    <rect x="46" y="34" width="5" height="18" rx="1" fill="#ffffff"/>
  </g>
</svg>
