<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark rounded background matching the masthead (--bg-secondary) -->
  <rect width="64" height="64" rx="13" fill="#1a2733"/>
  <!-- StatHead mark (football + bar chart), from logo.svg, centered -->
  <g transform="translate(0,0.8) scale(0.8)">
    <!-- Football outline -->
    <ellipse cx="40" cy="40" rx="32" ry="22" stroke="#4ade80" stroke-width="3" fill="none"/>
    <!-- Football left accent -->
    <path d="M12 30 Q20 40 12 50" stroke="#4ade80" stroke-width="3" fill="#4ade80" opacity="0.6"/>
    <!-- Football right accent -->
    <path d="M68 30 Q60 40 68 50" stroke="white" stroke-width="3" fill="white" opacity="0.6"/>
    <!-- Laces -->
    <line x1="32" y1="22" x2="48" y2="22" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="34" y1="22" x2="34" y2="18" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
    <line x1="38" y1="22" x2="38" y2="18" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
    <line x1="42" y1="22" x2="42" y2="18" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
    <line x1="46" y1="22" x2="46" y2="18" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
    <!-- Bar chart inside football -->
    <rect x="28" y="42" width="6" height="14" rx="1" fill="#94a3b8"/>
    <rect x="36" y="35" width="6" height="21" rx="1" fill="#cbd5e1"/>
    <rect x="44" y="28" width="6" height="28" rx="1" fill="#e2e8f0"/>
    <!-- Arrow on top bar -->
    <polygon points="47,24 44,30 50,30" fill="#e2e8f0"/>
  </g>
</svg>
